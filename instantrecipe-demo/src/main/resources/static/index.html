<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Recipe Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input {
            margin-bottom: 10px;
        }
        .recipe {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Instant Recipe Finder</h1>
    <form id="recipe-form">
        <label for="vegetables">Vegetables (comma separated):</label>
        <input type="text" id="vegetables" name="vegetables" placeholder="e.g. tomato, onion"><br>

        <label for="spices">Spices (comma separated):</label>
        <input type="text" id="spices" name="spices" placeholder="e.g. turmeric, cumin"><br>

        <label for="equipment">Equipment (comma separated):</label>
        <input type="text" id="equipment" name="equipment" placeholder="e.g. stove, blender"><br>

        <button type="submit">Find Recipes</button>
    </form>

    <div id="recipe-results"></div>

    <!-- Link the JavaScript file -->
    <script src="app.js"></script>
</body>
</html>
